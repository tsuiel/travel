<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 关键：必须加上这个视口标签，手机才会正常适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人旅游日记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "微软雅黑", sans-serif;
        }
        body {
            background: #f8f9fa;
            color: #333;
        }

        /* 导航 */
        nav {
            width: 100%;
            background: linear-gradient(135deg, #2c3e50, #4a6278);
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-size: 15px;
            letter-spacing: 1px;
            opacity: 0.9;
            transition: all 0.3s ease;
        }
        nav a:hover {
            opacity: 1;
            color: #a8d8ff;
        }

        /* 全屏横幅 */
        .banner {
            width: 100%;
            height: 220px;
            background: url("https://picsum.photos/id/1036/1920/600") center/cover no-repeat;
            position: relative;
        }
        .banner::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
        }

        /* 主容器 */
        .wrap {
            max-width: 850px;
            margin: -50px auto 50px;
            position: relative;
            z-index: 2;
            padding: 0 15px;
        }

        /* 日记列表 */
        .diary-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 卡片 */
        .diary-card {
            background: #fff;
            display: flex;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-decoration: none;
            color: #333;
            transition: all 0.4s ease;
        }
        .diary-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.1);
        }

        .diary-card img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            /* 防止图片被压缩变形 */
            flex-shrink: 0;
        }

        .card-text {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-text h3 {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .card-text p {
            font-size: 14px;
            color: #666;
            line-height: 1.7;
        }

        footer {
            text-align: center;
            padding: 25px 0;
            font-size: 13px;
            color: #999;
            background: #fff;
            border-top: 1px solid #eee;
        }

        /* 关键：手机端适配规则 */
        @media (max-width: 600px) {
            .diary-card {
                flex-direction: row; /* 强制保持横排 */
            }
            .diary-card img {
                width: 120px;
                height: 100px;
            }
            .card-text {
                padding: 12px;
            }
            .card-text h3 {
                font-size: 16px;
            }
            .card-text p {
                font-size: 13px;
                line-height: 1.6;
            }
            nav a {
                margin: 0 8px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

<!-- 导航 -->
<nav>
    <a href="index.html">首页</a>
    <a href="#">旅行日记</a>
    <a href="#">风景相册</a>
    <a href="#">关于我</a>
</nav>

<!-- 顶部大图 -->
<div class="banner"></div>

<!-- 主内容 -->
<div class="wrap">
    <div class="diary-list">
        <!-- 日记1 -->
        <a href="diary1.html" class="diary-card">
            <img src="https://picsum.photos/id/1019/200/150">
            <div class="card-text">
                <h3>大连海滨旅行日记</h3>
                <p>沿着海岸线慢行，听海风低语，看落日漫染海面，把旅途的温柔都收藏在记忆里。</p>
            </div>
        </a>
        <!-- 日记2 -->
        <a href="diary2.html" class="diary-card">
            <img src="https://picsum.photos/id/1015/200/150">
            <div class="card-text">
                <h3>星海广场漫步随笔</h3>
                <p>城市与大海相拥，白日海鸥成群，暮色晚风微凉，是独属于海滨城市的浪漫。</p>
            </div>
        </a>
        <!-- 日记3 -->
        <a href="diary3.html" class="diary-card">
            <img src="https://picsum.photos/id/292/200/150">
            <div class="card-text">
                <h3>大连美食生活记录</h3>
                <p>山海之间，烟火入味，用味蕾感受一座城市的温度与风情。</p>
            </div>
        </a>
    </div>
</div>

<footer>
    © 2026 个人旅游日记 | 记录每一段旅途
</footer>

</body>
</html>
