<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人旅游日记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", "微软雅黑", sans-serif;
        }
        body {
            background: #f8f9fa;
            color: #333;
        }

        /* 高级渐变导航 */
        nav {
            width: 100%;
            background: linear-gradient(135deg, #2c3e50, #4a6278);
            padding: 18px 0;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 20px;
            font-size: 15px;
            letter-spacing: 1px;
            opacity: 0.9;
            transition: all 0.3s ease;
        }
        nav a:hover {
            opacity: 1;
            color: #a8d8ff;
        }

        /* 全屏高级横幅 */
        .banner {
            width: 100%;
            height: 320px;
            background: url("https://picsum.photos/id/1036/1920/600") center/cover no-repeat;
            position: relative;
        }
        .banner::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.25);
        }

        /* 居中主容器 无右边栏 */
        .wrap {
            max-width: 850px;
            margin: -60px auto 60px;
            position: relative;
            z-index: 2;
            padding: 0 20px;
        }

        /* 日记列表 */
        .diary-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* 高级卡片 */
        .diary-card {
            background: #fff;
            display: flex;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-decoration: none;
            color: #333;
            transition: all 0.4s ease;
        }
        .diary-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 35px rgba(0,0,0,0.1);
        }

        .diary-card img {
            width: 220px;
            height: 170px;
            object-fit: cover;
        }

        .card-text {
            padding: 26px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-text h3 {
            font-size: 20px;
            color: #2c3e50;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .card-text p {
            font-size: 15px;
            color: #666;
            line-height: 1.8;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
            color: #999;
            background: #fff;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>

<!-- 导航 -->
<nav>
    
    <a href="#">旅行日记</a>
    <a href="photos.html">风景相册</a>
    <a href="profile.html">关于我</a>
</nav>

<!-- 顶部大图 无任何文字 -->
<div class="banner"></div>

<!-- 主内容 纯居中 无右侧栏 -->
<div class="wrap">
    <div class="diary-list">

        <!-- 日记1 可点击跳转 -->
        <a href="diary1.html" class="diary-card">
            <img src="https://picsum.photos/id/1019/220/170">
            <div class="card-text">
                <h3>大连海滨旅行日记</h3>
                <p>沿着海岸线慢行，听海风低语，看落日漫染海面，把旅途的温柔都收藏在记忆里。</p>
            </div>
        </a>

        <!-- 日记2 -->
        <a href="diary2.html" class="diary-card">
            <img src="https://picsum.photos/id/1015/220/170">
            <div class="card-text">
                <h3>星海广场漫步随笔</h3>
                <p>城市与大海相拥，白日海鸥成群，暮色晚风微凉，是独属于海滨城市的浪漫。</p>
            </div>
        </a>

        <!-- 日记3 -->
        <a href="diary3.html" class="diary-card">
            <img src="https://picsum.photos/id/292/220/170">
            <div class="card-text">
                <h3>大连美食生活记录</h3>
                <p>山海之间，烟火入味，用味蕾感受一座城市的温度与风情。</p>
            </div>
        </a>

    </div>
</div>

<footer>
    青春没有售价，旅行就再当下
</footer>

</body>
</html>
